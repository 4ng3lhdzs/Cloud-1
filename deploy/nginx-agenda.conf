# Sitio por defecto de nginx con PHP-FPM para la agenda
# setup_web.sh lo copia a /etc/nginx/sites-available/default
# y reemplaza __PHP_SOCK__ por el socket de php-fpm instalado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html index.htm index.nginx-debian.html;

    # Raíz: se deja como estaba (lo usa el health check del balanceador)
    location / {
        try_files $uri $uri/ =404;
    }

    # La agenda
    location /agenda/ {
        try_files $uri $uri/ /agenda/index.php?$query_string;
    }

    # Carpetas que NO deben verse desde el navegador
    location ~ ^/agenda/(database|deploy|includes)/ {
        deny all;
        return 404;
    }
    location ~ /\.(git|ht|env) {
        deny all;
        return 404;
    }

    # PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
    }
}
